<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fasilitas SanitaCheck</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .fasilitas-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .fasilitas-card:hover {
            transform: translateY(-5px);
        }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .status-bersih {
            background-color: #d4edda;
            color: #155724;
        }
        .status-perlu-perhatian {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-buruk {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status-belum {
            background-color: #e2e3e5;
            color: #383d41;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .nav-link {
            color: white !important;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .nav-link:hover {
            opacity: 1;
        }
        .nav-link.active {
            opacity: 1;
            font-weight: 600;
        }
        .filter-btn {
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .filter-btn:hover {
            transform: scale(1.05);
        }
        .filter-btn.active {
            font-weight: 600;
        }
        .modal-content {
            border-radius: 15px;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand fw-bold" href="api-dashboard.html">
                <i class="bi bi-shield-check me-2"></i>SanitaCheck
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="api-dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="api-fasilitas.html">Fasilitas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="beranda.php">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Loading -->
    <div id="loading" class="loading">
        <div class="text-center text-white">
            <div class="spinner-border mb-3" role="status"></div>
            <p>Memuat data fasilitas...</p>
        </div>
    </div>

    <!-- Fasilitas Content -->
    <div id="fasilitas-content" class="container py-5" style="display: none;">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-white fw-bold mb-2">Daftar Fasilitas</h1>
                <p class="text-white-50">Monitoring kebersihan semua fasilitas sanitasi</p>
            </div>
        </div>

        <!-- Filter Buttons -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm" style="border-radius: 15px;">
                    <div class="card-body p-3">
                        <div class="d-flex gap-2 flex-wrap">
                            <button class="filter-btn btn btn-light active" data-filter="all">
                                <i class="bi bi-list me-1"></i>Semua
                            </button>
                            <button class="filter-btn btn btn-success" data-filter="Bersih">
                                <i class="bi bi-check-circle me-1"></i>Bersih
                            </button>
                            <button class="filter-btn btn btn-warning" data-filter="Perlu Perhatian">
                                <i class="bi bi-exclamation-circle me-1"></i>Perlu Perhatian
                            </button>
                            <button class="filter-btn btn btn-danger" data-filter="Buruk">
                                <i class="bi bi-x-circle me-1"></i>Buruk
                            </button>
                            <button class="filter-btn btn btn-secondary" data-filter="Belum Diinspeksi">
                                <i class="bi bi-question-circle me-1"></i>Belum Diinspeksi
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fasilitas Grid -->
        <div class="row g-4" id="fasilitas-grid">
            <!-- Cards will be inserted here by JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5" style="display: none;">
            <div class="card border-0 shadow-sm" style="border-radius: 15px;">
                <div class="card-body py-5">
                    <i class="bi bi-inbox text-secondary" style="font-size: 3rem;"></i>
                    <p class="text-secondary mt-3 mb-0">Tidak ada fasilitas yang ditemukan.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Detail Fasilitas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modal-content">
                        <!-- Content will be inserted here -->
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let allFasilitas = [];
        let currentFilter = 'all';

        async function fetchFasilitas() {
            try {
                const response = await fetch(`${API_BASE}/fasilitas`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    allFasilitas = result.data;
                    renderFasilitas();
                    
                    // Hide loading, show content
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('fasilitas-content').style.display = 'block';
                }
            } catch (error) {
                console.error('Error fetching fasilitas:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center text-white">
                        <i class="bi bi-exclamation-triangle fs-1 mb-3"></i>
                        <p>Gagal memuat data. Silakan refresh halaman.</p>
                        <button onclick="location.reload()" class="btn btn-light">Refresh</button>
                    </div>
                `;
            }
        }

        function getStatusClass(status) {
            switch(status) {
                case 'Bersih': return 'status-bersih';
                case 'Perlu Perhatian': return 'status-perlu-perhatian';
                case 'Buruk': return 'status-buruk';
                default: return 'status-belum';
            }
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'Bersih': return 'bi-check-circle';
                case 'Perlu Perhatian': return 'bi-exclamation-circle';
                case 'Buruk': return 'bi-x-circle';
                default: return 'bi-question-circle';
            }
        }

        function renderFasilitas() {
            const grid = document.getElementById('fasilitas-grid');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = allFasilitas;
            if (currentFilter !== 'all') {
                filtered = allFasilitas.filter(f => f.status === currentFilter);
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            grid.innerHTML = filtered.map(f => `
                <div class="col-md-6 col-lg-4">
                    <div class="card fasilitas-card bg-white" onclick="showDetail(${f.id})">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h6 class="fw-bold mb-1">${f.nama}</h6>
                                    <p class="text-secondary small mb-0">
                                        <i class="bi bi-geo-alt me-1"></i>${f.lokasi}
                                    </p>
                                </div>
                                <span class="status-badge ${getStatusClass(f.status)}">
                                    <i class="bi ${getStatusIcon(f.status)} me-1"></i>${f.status}
                                </span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="small text-secondary">
                                    <i class="bi bi-person me-1"></i>${f.petugas}
                                </div>
                                <div class="small text-secondary">
                                    <i class="bi bi-clock me-1"></i>${formatDate(f.terakhir_inspeksi)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function formatDate(dateString) {
            if (!dateString || dateString === 'Belum Diinspeksi') return 'Belum ada';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function showDetail(id) {
            try {
                const response = await fetch(`${API_BASE}/fasilitas/${id}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const f = result.data;
                    const modalContent = document.getElementById('modal-content');
                    
                    modalContent.innerHTML = `
                        <div class="mb-4">
                            <h6 class="fw-bold mb-2">${f.nama}</h6>
                            <p class="text-secondary mb-1">
                                <i class="bi bi-building me-2"></i>${f.jenis}
                            </p>
                            <p class="text-secondary mb-0">
                                <i class="bi bi-geo-alt me-2"></i>${f.lokasi}
                            </p>
                        </div>
                        <div class="row mb-4">
                            <div class="col-6">
                                <div class="p-3 rounded bg-light">
                                    <div class="text-secondary small mb-1">Status</div>
                                    <span class="status-badge ${getStatusClass(f.status)}">
                                        <i class="bi ${getStatusIcon(f.status)} me-1"></i>${f.status}
                                    </span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-3 rounded bg-light">
                                    <div class="text-secondary small mb-1">Terakhir Inspeksi</div>
                                    <div class="fw-semibold">${formatDate(f.terakhir_inspeksi)}</div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <div class="p-3 rounded bg-light">
                                <div class="text-secondary small mb-1">Penanggung Jawab</div>
                                <div class="fw-semibold">
                                    <i class="bi bi-person me-2"></i>${f.petugas}
                                </div>
                            </div>
                        </div>
                        <div>
                            <button class="btn btn-primary w-100" onclick="showRiwayat(${f.id})">
                                <i class="bi bi-clock-history me-2"></i>Lihat Riwayat Inspeksi
                            </button>
                        </div>
                    `;
                    
                    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
                    modal.show();
                }
            } catch (error) {
                console.error('Error fetching detail:', error);
                alert('Gagal memuat detail fasilitas');
            }
        }

        async function showRiwayat(id) {
            try {
                const response = await fetch(`${API_BASE}/fasilitas/${id}/inspeksi`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const riwayat = result.data;
                    let riwayatHtml = '';
                    
                    if (riwayat.length === 0) {
                        riwayatHtml = '<p class="text-secondary text-center py-3">Belum ada riwayat inspeksi</p>';
                    } else {
                        riwayatHtml = riwayat.map(r => `
                            <div class="border-bottom py-3">
                                <div class="d-flex justify-content-between mb-1">
                                    <span class="fw-semibold">${formatDate(r.tanggal)}</span>
                                    <span class="status-badge ${getStatusClass(r.status)}">${r.status}</span>
                                </div>
                                <div class="small text-secondary mb-1">
                                    <i class="bi bi-person me-1"></i>${r.petugas}
                                </div>
                                <div class="small">${r.kondisi}</div>
                            </div>
                        `).join('');
                    }
                    
                    const modalContent = document.getElementById('modal-content');
                    modalContent.innerHTML = `
                        <h6 class="fw-bold mb-3">Riwayat Inspeksi</h6>
                        <div class="bg-light rounded p-3">
                            ${riwayatHtml}
                        </div>
                        <button class="btn btn-secondary mt-3" onclick="location.reload()">
                            <i class="bi bi-arrow-left me-2"></i>Kembali
                        </button>
                    `;
                }
            } catch (error) {
                console.error('Error fetching riwayat:', error);
                alert('Gagal memuat riwayat inspeksi');
            }
        }

        // Filter button handlers
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderFasilitas();
            });
        });

        // Check URL for filter
        const urlParams = new URLSearchParams(window.location.search);
        const filterParam = urlParams.get('status');
        if (filterParam) {
            currentFilter = filterParam;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filterParam) {
                    btn.classList.add('active');
                }
            });
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', fetchFasilitas);
    </script>
</body>
</html>
